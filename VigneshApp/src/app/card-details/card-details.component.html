<div
    class="border border-solid border-lime-600 shadow-lime-400 shadow-sm flex flex-col justify-center px-4 py-10">
    <h1 class="text-2xl mb-10 text-center">User Payment Information</h1>
    <div class="flex mx-10">
        <div class="flex flex-col min-w-[400px] mr-10 bg-slate-600 p-5">
            <div class="flex my-4">
                <label for="username" class="mx-2 w-1/3">Username</label>
                <input type="text" id="username" class="mx-2 w-2/3 p-1" [(ngModel)]="userName">
            </div>
            <div class="flex my-4">
                <label for="cardno" class="mx-2 w-1/3">Card No</label>
                <input type="number" id="cardno" class="mx-2 w-2/3 p-1" [(ngModel)]="cardNumber">
            </div>
            <div class="flex my-4">
                <label for="amount" class="mx-2 w-1/3">Amount</label>
                <input type="number" id="amount" class="mx-2 w-2/3 p-1" [(ngModel)]="amount">
            </div>
            <div class="flex my-4 ">
                <button class="bg-lime-600 hover:bg-lime-500 w-full p-2 my-3">Add Payment</button>
            </div>
        </div>
        <div class="flex" *ngIf="cardNumber">
            <div class="w-96 h-56 m-auto bg-red-100 rounded-xl relative text-white shadow-2xl transition-transform transform hover:scale-110">
            
                <img class="relative object-cover w-full h-full rounded-xl" src="https://i.imgur.com/kGkSg1v.png">
                
                <div class="w-full px-8 absolute top-8">
                    <div class="flex justify-between">
                        <div class="">
                            <p class="font-light">
                                Name
                            </p>
                            <p class="font-medium tracking-widest">
                               {{userName}}
                            </p>
                        </div>
                        <img class="w-14 h-14" src="https://i.imgur.com/bbPHJVe.png"/>
                    </div>
                    <div class="pt-1">
                        <p class="font-light">
                            Card Number
                        </p>
                        <p class="font-medium tracking-more-wider">
                            {{cardNumber}}
                        </p>
                    </div>
                    <div class="pt-6 pr-6">
                        <div class="flex justify-between">
                            <div class="">
                                <p class="font-light text-xs">
                                    Valid
                                </p>
                                <p class="font-medium tracking-wider text-sm">
                                    11/15
                                </p>
                            </div>
                            <div class="">
                                <p class="font-light text-xs">
                                    Expiry
                                </p>
                                <p class="font-medium tracking-wider text-sm">
                                    03/25
                                </p>
                            </div>
    
                            <div class="">
                                <p class="font-light text-xs">
                                    CVV
                                </p>
                                <p class="font-bold tracking-more-wider text-sm">
                                    ···
                                </p>
                            </div>
                        </div>
                    </div>
    
                </div>
            </div>
        </div>
    </div>
</div>
